# =============================================================================
# l1 - Sealed Secrets: controller values (chart sealed-secrets-2.20.0, controller 0.40.0)
#
# A SealedSecret is a Secret encrypted with the controller's public key, so the YAML is safe in Git.
# Only the controller, which holds the private key, can turn it back into a Secret.
#
#   kubeseal (local)  --encrypt with public cert-->  SealedSecret YAML  --git/kubectl-->  cluster
#   controller        --decrypt with private key--> native Secret
#
# Install (the chart repo moved from bitnami-labs.github.io to bitnami.github.io):
#   helm repo add sealed-secrets https://bitnami.github.io/sealed-secrets && helm repo update
#   helm install sealed-secrets sealed-secrets/sealed-secrets --version 2.20.0 \
#     --namespace kube-system -f l1-install-controller.yaml
#
# kubeseal (match the controller minor version; verify the release checksum):
#   V=0.40.0
#   curl -fsSLO "https://github.com/bitnami/sealed-secrets/releases/download/v${V}/kubeseal-${V}-linux-amd64.tar.gz"
#   curl -fsSLO "https://github.com/bitnami/sealed-secrets/releases/download/v${V}/sealed-secrets_${V}_checksums.txt"
#   grep "kubeseal-${V}-linux-amd64.tar.gz" "sealed-secrets_${V}_checksums.txt" | sha256sum -c -
#   tar -xzf "kubeseal-${V}-linux-amd64.tar.gz" kubeseal && sudo install -m 755 kubeseal /usr/local/bin/
#
# Values below were checked against `helm show values sealed-secrets/sealed-secrets --version 2.20.0`.
# Helm ignores keys a chart does not define, so a misspelled key fails silently; CI runs helm template
# and asserts the settings landed in the rendered manifests.
# =============================================================================

# kubeseal looks for a controller called `sealed-secrets-controller` in `kube-system`. The chart names it
# after the release (`sealed-secrets`), so pin the name instead of passing --controller-name every time.
fullnameOverride: sealed-secrets-controller

image:
  registry: docker.io
  repository: bitnami/sealed-secrets-controller
  tag: 0.40.0
  pullPolicy: IfNotPresent

# --- Sealing key lifecycle ---------------------------------------------------
# A new sealing key is generated every keyrenewperiod; OLD KEYS ARE KEPT so existing SealedSecrets still
# decrypt. Rotation protects future secrets and shrinks the blast radius of a leaked key; it does not
# re-encrypt what is already in Git (do that with `kubeseal --re-encrypt`, see l2).
keyrenewperiod: "720h"        # 30 days; "0" disables
keyttl: "87600h"              # certificate validity (10 years)

# Extra namespaces to watch besides the release namespace (empty = all)
additionalNamespaces: []

# --- Hardening (these are the chart's own keys) -------------------------------
podSecurityContext:
  enabled: true
  fsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 1001
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {cpu: 200m, memory: 128Mi}

# --- Metrics -----------------------------------------------------------------
metrics:
  serviceMonitor:
    enabled: false            # true with the Prometheus Operator installed

# --- Availability / network ---------------------------------------------------
pdb:
  create: false               # one replica: a PDB would block node drains
networkPolicy:
  enabled: false

serviceAccount:
  create: true
rbac:
  create: true
