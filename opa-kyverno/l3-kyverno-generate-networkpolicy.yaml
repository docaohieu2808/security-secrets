# =============================================================================
# l3-kyverno-generate-networkpolicy.yaml — Kyverno: Auto-generate NetworkPolicy per Namespace
#
# Kyverno generate rules automatically create companion resources whenever a
# trigger resource is created/updated. This policy creates a default-deny
# NetworkPolicy in every new namespace, enforcing network micro-segmentation
# from day zero without manual intervention.
#
# Apply:
#   kubectl apply -f l3-kyverno-generate-networkpolicy.yaml
#
# After applying, test by creating a namespace:
#   kubectl create namespace test-team
#   kubectl get networkpolicy -n test-team
# =============================================================================

---
# Policy 1: Generate default-deny NetworkPolicy when a Namespace is created
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: generate-default-deny-networkpolicy-on-namespace-create
  annotations:
    policies.kyverno.io/title: Generate Default-Deny NetworkPolicy
    policies.kyverno.io/category: Network Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Namespace, NetworkPolicy
    policies.kyverno.io/description: >
      Automatically creates a default-deny-all NetworkPolicy in every new namespace
      (excluding system namespaces). This enforces a zero-trust network posture —
      all traffic is denied until explicitly allowed by additional NetworkPolicies.
spec:
  rules:
    - name: generate-default-deny-all-networkpolicy
      match:
        any:
          - resources:
              kinds: [Namespace]
      exclude:
        any:
          - resources:
              names:
                - kube-system
                - kube-public
                - kube-node-lease
                - default
                - kyverno
                - gatekeeper-system
                - cert-manager
                - falco
                - monitoring
                - logging
      generate:
        # synchronize: true — Kyverno will reconcile the generated resource
        # if it is manually deleted or modified
        synchronize: true
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        name: default-deny-all-ingress-egress
        namespace: "{{request.object.metadata.name}}"
        data:
          metadata:
            labels:
              kyverno-generated: "true"
              policy: default-deny-all
          spec:
            # Empty podSelector matches ALL pods in the namespace
            podSelector: {}
            # Specifying both Ingress and Egress in policyTypes with no rules = deny all
            policyTypes:
              - Ingress
              - Egress

---
# Policy 2: Generate allow-DNS egress NetworkPolicy alongside default-deny
# Without DNS egress, pods cannot resolve service names — this allows kube-dns only
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: generate-allow-dns-egress-networkpolicy-on-namespace-create
  annotations:
    policies.kyverno.io/title: Generate Allow DNS Egress NetworkPolicy
    policies.kyverno.io/category: Network Security
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: Namespace, NetworkPolicy
    policies.kyverno.io/description: >
      Generates a NetworkPolicy that allows all pods in a namespace to reach
      kube-dns (port 53 UDP/TCP) for DNS resolution. Applied alongside the
      default-deny policy to allow basic service discovery.
spec:
  rules:
    - name: generate-allow-dns-egress
      match:
        any:
          - resources:
              kinds: [Namespace]
      exclude:
        any:
          - resources:
              names:
                - kube-system
                - kube-public
                - kube-node-lease
                - default
                - kyverno
                - gatekeeper-system
                - cert-manager
                - falco
      generate:
        synchronize: true
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        name: allow-dns-egress-to-kube-dns
        namespace: "{{request.object.metadata.name}}"
        data:
          metadata:
            labels:
              kyverno-generated: "true"
              policy: allow-dns-egress
          spec:
            podSelector: {}
            policyTypes:
              - Egress
            egress:
              # Allow UDP and TCP to kube-dns on port 53
              - ports:
                  - port: 53
                    protocol: UDP
                  - port: 53
                    protocol: TCP
                to:
                  - namespaceSelector:
                      matchLabels:
                        kubernetes.io/metadata.name: kube-system

---
# Policy 3: Generate ResourceQuota when Namespace is created
# Prevents any single namespace from consuming unbounded cluster resources
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: generate-default-resourcequota-on-namespace-create
  annotations:
    policies.kyverno.io/title: Generate Default ResourceQuota
    policies.kyverno.io/category: Resource Management
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Namespace, ResourceQuota
    policies.kyverno.io/description: >
      Automatically creates a default ResourceQuota in every new namespace to
      prevent resource exhaustion. Teams can request quota increases via the
      platform team process.
spec:
  rules:
    - name: generate-default-resourcequota
      match:
        any:
          - resources:
              kinds: [Namespace]
              selector:
                matchLabels:
                  environment: "production"
      exclude:
        any:
          - resources:
              names:
                - kube-system
                - kube-public
                - kube-node-lease
                - default
                - kyverno
      generate:
        synchronize: true
        apiVersion: v1
        kind: ResourceQuota
        name: default-quota
        namespace: "{{request.object.metadata.name}}"
        data:
          spec:
            hard:
              requests.cpu: "4"
              requests.memory: 8Gi
              limits.cpu: "8"
              limits.memory: 16Gi
              pods: "50"
              services: "20"
              persistentvolumeclaims: "10"
              secrets: "50"
              configmaps: "50"

---
# Policy 4: Generate LimitRange to set default container resource limits
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: generate-default-limitrange-on-namespace-create
  annotations:
    policies.kyverno.io/title: Generate Default LimitRange
    policies.kyverno.io/category: Resource Management
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: Namespace, LimitRange
    policies.kyverno.io/description: >
      Creates a LimitRange with default CPU/memory requests and limits in new
      namespaces. Ensures containers without explicit resource specs still have
      sensible defaults applied by the scheduler.
spec:
  rules:
    - name: generate-default-limitrange
      match:
        any:
          - resources:
              kinds: [Namespace]
      exclude:
        any:
          - resources:
              names:
                - kube-system
                - kube-public
                - kube-node-lease
                - default
                - kyverno
      generate:
        synchronize: true
        apiVersion: v1
        kind: LimitRange
        name: default-limit-range
        namespace: "{{request.object.metadata.name}}"
        data:
          spec:
            limits:
              - type: Container
                default:
                  cpu: 500m
                  memory: 256Mi
                defaultRequest:
                  cpu: 100m
                  memory: 128Mi
                max:
                  cpu: "4"
                  memory: 4Gi
                min:
                  cpu: 50m
                  memory: 64Mi
