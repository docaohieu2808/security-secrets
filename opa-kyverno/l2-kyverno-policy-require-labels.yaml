# =============================================================================
# l2-kyverno-policy-require-labels.yaml — Kyverno: Enforce required labels on K8s resources
#
# Kyverno is a Kubernetes-native policy engine — policies are CRDs, no Rego needed.
#
# Prerequisites:
#   helm repo add kyverno https://kyverno.github.io/kyverno/
#   helm install kyverno kyverno/kyverno --namespace kyverno --create-namespace
#
# Apply:
#   kubectl apply -f l2-kyverno-policy-require-labels.yaml
#
# Policy types:
#   - validate: reject resources that fail checks
#   - mutate:   modify resources before admission
#   - generate: create related resources automatically
#   - verifyImages: enforce image signature verification
# =============================================================================

---
# Policy 1: Require standard labels on all Deployments
# Enforces app.kubernetes.io/* label conventions for observability and cost tracking
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-standard-labels-on-deployments
  annotations:
    policies.kyverno.io/title: Require Standard Labels
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Deployment
    policies.kyverno.io/description: >
      Enforces the Kubernetes recommended label schema on Deployments.
      Labels are used for service discovery, monitoring dashboards, and cost allocation.
spec:
  validationFailureAction: Enforce    # Enforce | Audit
  background: true                    # Also check existing resources
  rules:
    - name: check-required-labels
      match:
        any:
          - resources:
              kinds: [Deployment]
              namespaces: ["*"]
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
                - gatekeeper-system
                - cert-manager
      validate:
        message: >
          Deployment must have labels: app.kubernetes.io/name, app.kubernetes.io/version,
          app.kubernetes.io/component, app.kubernetes.io/managed-by, and 'team'.
        pattern:
          metadata:
            labels:
              app.kubernetes.io/name: "?*"
              app.kubernetes.io/version: "?*"
              app.kubernetes.io/component: "?*"
              app.kubernetes.io/managed-by: "?*"
              team: "?*"

---
# Policy 2: Require team and environment labels on Namespaces
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-team-env-labels-on-namespaces
  annotations:
    policies.kyverno.io/title: Require Team and Environment Labels on Namespaces
    policies.kyverno.io/category: Multi-tenancy
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Namespace
    policies.kyverno.io/description: >
      All non-system namespaces must declare their owning team and environment
      (dev/staging/prod) for cost allocation and RBAC policy targeting.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: check-namespace-labels
      match:
        any:
          - resources:
              kinds: [Namespace]
      exclude:
        any:
          - resources:
              names:
                - kube-system
                - kube-public
                - kube-node-lease
                - default
                - kyverno
                - gatekeeper-system
                - cert-manager
                - falco
      validate:
        message: >
          Namespace must have 'team' label (e.g. team=platform) and
          'environment' label (e.g. environment=production).
        pattern:
          metadata:
            labels:
              team: "?*"
              environment: "dev | staging | production"

---
# Policy 3: Auto-mutate — add default labels if missing (best-effort)
# Adds 'managed-by: kyverno' label to resources that are missing it
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: mutate-add-managed-by-label-if-missing
  annotations:
    policies.kyverno.io/title: Add managed-by Label
    policies.kyverno.io/category: Workload Management
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: Deployment,StatefulSet,DaemonSet
    policies.kyverno.io/description: >
      Automatically adds the 'app.kubernetes.io/managed-by' label to workloads
      that are missing it, defaulting to 'kubectl' as a signal for manual deployments.
spec:
  rules:
    - name: add-managed-by-label
      match:
        any:
          - resources:
              kinds: [Deployment, StatefulSet, DaemonSet]
      exclude:
        any:
          - resources:
              namespaces: [kube-system, kyverno]
      mutate:
        patchStrategicMerge:
          metadata:
            labels:
              # Only add if not already present
              +(app.kubernetes.io/managed-by): kubectl

---
# Policy 4: Require image pull policy to be Always for mutable tags
# Ensures :latest or untagged images are always re-pulled (not cached stale versions)
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-imagepullpolicy-always-for-mutable-tags
  annotations:
    policies.kyverno.io/title: Require imagePullPolicy Always for Mutable Tags
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >
      Containers using :latest or no image tag must set imagePullPolicy: Always
      to ensure the node always pulls the current image rather than using a cached
      potentially outdated version.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: check-imagepullpolicy-for-latest
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              namespaces: [kube-system, kyverno]
      validate:
        message: >
          Containers using ':latest' tag or no tag must set imagePullPolicy: Always.
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                any:
                  - key: "{{ element.image }}"
                    operator: Equals
                    value: "*:latest"
                    message: "Container uses :latest tag without imagePullPolicy: Always"
