# =============================================================================
# l1 - SonarQube Community Build + PostgreSQL via Docker Compose
#
# SonarQube moved from "10.x LTS" tags to year/month versions: the Community Build is now
# 26.10 (tag 26.10.0.133078-community). The old `sonarqube:10-community` tag stopped at 2024
# and no longer gets fixes. Pin the full tag; `community` floats to the newest build.
#
# Host prerequisites (Elasticsearch inside SonarQube refuses to start without them):
#   sudo sysctl -w vm.max_map_count=524288
#   sudo sysctl -w fs.file-max=131072
#
#   docker compose -f l1-docker-compose-sonarqube.yml up -d --wait     # ~2 minutes
#   ./l1-bootstrap.sh                                                  # change admin/admin, print an analysis token
#
# The UI/API listen on 127.0.0.1 only. Put a reverse proxy with TLS in front before exposing it.
# Override the database password: SONAR_DB_PASSWORD=... docker compose ... up -d
# =============================================================================
name: sonarqube-lab

services:
  sonarqube-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-sonar_password}   # dev default; override outside a laptop
      POSTGRES_DB: sonarqube
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    networks: [sonarqube-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonarqube"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  sonarqube:
    image: sonarqube:26.10.0.133078-community
    restart: unless-stopped
    depends_on:
      sonarqube-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-sonar_password}
      # JVM heap per process: web server, compute engine, Elasticsearch
      SONAR_WEB_JAVAOPTS: "-Xmx1g -Xms256m"
      SONAR_CE_JAVAOPTS: "-Xmx2g -Xms512m"
      SONAR_SEARCH_JAVAOPTS: "-Xmx1g -Xms1g"
    ports:
      - "127.0.0.1:9000:9000"       # web UI + API. Nothing else needs publishing.
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    networks: [sonarqube-net]
    ulimits:
      nofile: {soft: 131072, hard: 131072}
      nproc: {soft: 8192, hard: 8192}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 90s

volumes:
  sonarqube_db_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:

networks:
  sonarqube-net:
