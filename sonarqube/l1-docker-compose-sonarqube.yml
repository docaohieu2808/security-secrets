# =============================================================================
# l1-docker-compose-sonarqube.yml — SonarQube: Local dev stack via Docker Compose
#
# Starts SonarQube Community Edition + PostgreSQL for local SAST development.
#
# Usage:
#   # Increase vm.max_map_count required by Elasticsearch inside SonarQube
#   sudo sysctl -w vm.max_map_count=524288
#   sudo sysctl -w fs.file-max=131072
#
#   docker compose -f l1-docker-compose-sonarqube.yml up -d
#
# Access:
#   http://localhost:9000
#   Default credentials: admin / admin  (change immediately on first login)
#
# Upgrade:
#   docker compose -f l1-docker-compose-sonarqube.yml pull
#   docker compose -f l1-docker-compose-sonarqube.yml up -d
# =============================================================================

version: "3.8"

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — SonarQube metadata database
  # ---------------------------------------------------------------------------
  sonarqube-db:
    image: postgres:15-alpine
    container_name: sonarqube-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar_password       # Change in production
      POSTGRES_DB: sonarqube
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    networks:
      - sonarqube-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonarqube"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # SonarQube Community Edition
  # For production, use sonarqube:enterprise or sonarqube:developer
  # ---------------------------------------------------------------------------
  sonarqube:
    image: sonarqube:10-community
    container_name: sonarqube
    restart: unless-stopped
    depends_on:
      sonarqube-db:
        condition: service_healthy
    environment:
      # Database connection
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar_password     # Match POSTGRES_PASSWORD above

      # JVM heap tuning — increase for large codebases
      SONAR_CE_JAVAOPTS: "-Xmx2g -Xms512m"
      SONAR_WEB_JAVAOPTS: "-Xmx1g -Xms256m"

      # Web context path (keep / for local, set /sonarqube for reverse proxy)
      SONAR_WEB_CONTEXT: /

      # Enable LDAP/SAML SSO in production by adding:
      # SONAR_SECURITY_REALM: LDAP
      # LDAP_URL: ldap://ldap-server:389

    ports:
      - "9000:9000"     # SonarQube web UI
      - "9092:9092"     # SonarQube compute engine (internal, expose only if needed)

    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_conf:/opt/sonarqube/conf

    networks:
      - sonarqube-net

    # Required: SonarQube uses Elasticsearch internally which needs higher ulimits
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc:
        soft: 4096
        hard: 4096

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s    # SonarQube takes ~2 minutes to fully start

# --- Volumes -----------------------------------------------------------------
volumes:
  sonarqube_db_data:
    driver: local
  sonarqube_data:
    driver: local
  sonarqube_logs:
    driver: local
  sonarqube_extensions:
    driver: local
  sonarqube_conf:
    driver: local

# --- Networks ----------------------------------------------------------------
networks:
  sonarqube-net:
    driver: bridge
