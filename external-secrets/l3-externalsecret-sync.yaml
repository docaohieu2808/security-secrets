# =============================================================================
# l3-externalsecret-sync.yaml — External Secrets: Sync secrets from Vault into K8s
#
# ExternalSecret defines WHAT to sync from an external provider.
# References a SecretStore (or ClusterSecretStore) for the connection.
#
# Apply:
#   kubectl apply -f l3-externalsecret-sync.yaml
#
# Monitor sync status:
#   kubectl get externalsecret -n myapp
#   kubectl describe externalsecret myapp-db-credentials -n myapp
#   kubectl get secret myapp-db-credentials -n myapp
# =============================================================================

---
# ExternalSecret 1: Sync database credentials from Vault KV v2
# Source: secret/data/myapp/database in Vault
# Destination: K8s Secret 'myapp-db-credentials' in namespace 'myapp'
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: myapp-db-credentials
  namespace: myapp
  labels:
    app.kubernetes.io/name: myapp
    team: platform
spec:
  # How often to poll Vault for changes (resync interval)
  refreshInterval: 1h

  # Reference to the SecretStore that defines Vault connection
  secretStoreRef:
    name: vault-backend
    kind: SecretStore    # or ClusterSecretStore for cluster-wide stores

  # The K8s Secret that will be created/updated
  target:
    name: myapp-db-credentials
    # creationPolicy: who owns the Secret. Owner = ESO creates it with an ownerReference, so Kubernetes
    # garbage-collects it when the ExternalSecret is deleted. Use Orphan to keep the Secret in that case.
    creationPolicy: Owner
    # deletionPolicy: what ESO does when the key disappears from the PROVIDER.
    # Retain keeps the last synced Secret (safer for prod); Delete removes it; Merge removes only the keys.
    deletionPolicy: Retain
    template:
      type: Opaque
      # Optional: add labels/annotations to the generated Secret
      metadata:
        labels:
          managed-by: external-secrets
          vault-path: secret/myapp/database

  # Which keys to fetch from Vault KV v2
  data:
    - secretKey: DB_HOST        # Key in K8s Secret
      remoteRef:
        key: myapp/database     # Path in Vault (relative to mount path)
        property: host          # Field within the Vault secret

    - secretKey: DB_PORT
      remoteRef:
        key: myapp/database
        property: port

    - secretKey: DB_USERNAME
      remoteRef:
        key: myapp/database
        property: username

    - secretKey: DB_PASSWORD
      remoteRef:
        key: myapp/database
        property: password

    - secretKey: DB_NAME
      remoteRef:
        key: myapp/database
        property: dbname

---
# ExternalSecret 2: Sync all keys from a Vault path (dataFrom)
# Useful when you want to sync an entire Vault secret as-is
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: myapp-api-keys
  namespace: myapp
spec:
  refreshInterval: 30m

  secretStoreRef:
    name: vault-backend
    kind: SecretStore

  target:
    name: myapp-api-keys
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          managed-by: external-secrets

  # dataFrom syncs ALL key-value pairs from a Vault path at once
  # No need to enumerate individual fields
  dataFrom:
    - extract:
        key: myapp/api-keys    # All fields from this Vault path are synced

---
# ExternalSecret 3: a TLS certificate issued by Vault's PKI engine
# `pki-int/issue/web-server` is a WRITE endpoint (it signs a new CSR on every call), so it cannot be read
# with remoteRef like a KV path. The VaultDynamicSecret generator does the POST and exposes the response.
# Each refresh issues a new certificate + key pair, so keep refreshInterval below the cert TTL.
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata:
  name: web-server-cert
  namespace: myapp
spec:
  path: /pki-int/issue/web-server
  method: POST
  parameters:
    common_name: myapp.example.internal
    ttl: 24h
  resultType: Data
  provider:
    server: "https://vault.vault.svc.cluster.local:8200"
    auth:
      kubernetes:
        mountPath: kubernetes
        role: external-secrets-role
        serviceAccountRef:
          name: external-secrets
          namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: myapp-tls-cert
  namespace: myapp
spec:
  refreshInterval: 6h
  target:
    name: myapp-tls-cert
    creationPolicy: Owner
    template:
      # kubernetes.io/tls requires tls.crt and tls.key
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ .certificate }}\n{{ .issuing_ca }}"
        tls.key: "{{ .private_key }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: web-server-cert

---
# ExternalSecret 4: Sync from AWS Secrets Manager via ClusterSecretStore
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: myapp-aws-secrets
  namespace: myapp
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secretsmanager-backend
    kind: ClusterSecretStore

  target:
    name: myapp-aws-secrets
    creationPolicy: Owner

  dataFrom:
    - extract:
        # AWS Secrets Manager secret name or ARN
        key: myapp/production/config
        # Optional: specific version
        # version: AWSCURRENT

---
# ExternalSecret 5: Sync from GCP Secret Manager
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: myapp-gcp-secrets
  namespace: myapp
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: gcp-secretmanager-backend
    kind: ClusterSecretStore

  target:
    name: myapp-gcp-secrets
    creationPolicy: Owner
    template:
      metadata:
        labels:
          managed-by: external-secrets
          provider: gcp-secret-manager

  data:
    - secretKey: STRIPE_SECRET_KEY
      remoteRef:
        # GCP Secret Manager secret name
        key: myapp-stripe-secret-key
        # Optional: specific version (default: latest)
        version: latest

    - secretKey: SENDGRID_API_KEY
      remoteRef:
        key: myapp-sendgrid-api-key
        version: latest

---
# PushSecret: write a K8s Secret INTO Vault (reverse direction)
# Useful for secrets generated in-cluster (e.g., cert-manager certs)
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: push-cluster-cert-to-vault
  namespace: myapp
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - name: vault-backend
      kind: SecretStore

  selector:
    secret:
      name: myapp-tls-cert    # Source: K8s Secret to push

  data:
    - match:
        secretKey: tls.crt
        remoteRef:
          remoteKey: myapp/cluster-cert
          property: certificate
    - match:
        secretKey: tls.key
        remoteRef:
          remoteKey: myapp/cluster-cert
          property: private_key
