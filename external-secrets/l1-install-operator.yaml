# =============================================================================
# l1-install-operator.yaml — External Secrets Operator: Helm install values
#
# External Secrets Operator (ESO) syncs secrets FROM external providers
# (Vault, AWS SSM/SecretsManager, GCP Secret Manager, Azure KeyVault, etc.)
# INTO native Kubernetes Secrets.
#
# Architecture:
#   ExternalSecret CR → ESO controller → external provider → K8s Secret
#
# Install:
#   helm repo add external-secrets https://charts.external-secrets.io
#   helm repo update
#   helm install external-secrets external-secrets/external-secrets --version 2.14.0 \
#     --namespace external-secrets --create-namespace \
#     --values l1-install-operator.yaml
#
# Chart 2.x serves external-secrets.io/v1 only: v1beta1 is not served any more (the escape hatch
# crds.unsafeServeV1Beta1 is scheduled for removal), so every manifest in this directory uses v1.
# PushSecret and the generators are still v1alpha1.
#
# Verify:
#   kubectl get pods -n external-secrets
#   kubectl get crds | grep external-secrets
# =============================================================================

# --- Core controller ---------------------------------------------------------
replicaCount: 2     # HA — run 2 replicas with leader election

image:
  repository: ghcr.io/external-secrets/external-secrets
  pullPolicy: IfNotPresent
  tag: ""    # Uses chart appVersion by default

# --- Leader election (required for replicaCount > 1) ------------------------
leaderElect: true

# --- Resources ---------------------------------------------------------------
resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

# --- Security context --------------------------------------------------------
# The chart already ships a restricted securityContext (non-root, read-only rootfs, drop ALL,
# RuntimeDefault seccomp); these blocks only make the intent explicit.
podSecurityContext:
  enabled: true

securityContext:
  enabled: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# --- Service account ---------------------------------------------------------
serviceAccount:
  create: true
  name: external-secrets
  annotations:
    # GKE Workload Identity — binds K8s SA to GCP SA for GCP Secret Manager
    # iam.gke.io/gcp-service-account: external-secrets@MY_PROJECT.iam.gserviceaccount.com

    # EKS IRSA — binds K8s SA to AWS IAM role for AWS SSM/SecretsManager
    # eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/external-secrets-role

# --- Webhook (validates ExternalSecret / SecretStore CRs) --------------------
webhook:
  replicaCount: 1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi

# --- Cert Controller (manages webhook TLS certs) ----------------------------
certController:
  replicaCount: 1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi

# --- Metrics -----------------------------------------------------------------
metrics:
  service:
    enabled: true
    port: 8080

serviceMonitor:
  enabled: false    # Set true with Prometheus Operator

# --- RBAC --------------------------------------------------------------------
rbac:
  create: true

# --- CRDs -------------------------------------------------------------------
installCRDs: true    # Let Helm manage CRDs (simpler upgrades)
crds:
  unsafeServeV1Beta1: false    # keep false: v1beta1 is deprecated and the flag is going away

# --- Node placement ----------------------------------------------------------
nodeSelector: {}
tolerations: []
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: external-secrets
          topologyKey: kubernetes.io/hostname

# --- Pod disruption budget ---------------------------------------------------
podDisruptionBudget:
  enabled: true
  minAvailable: 1
