# =============================================================================
# l2-secretstore-vault.yaml — External Secrets: SecretStore backed by HashiCorp Vault
#
# SecretStore defines HOW ESO connects to an external secret provider.
# ClusterSecretStore is cluster-scoped (shared across namespaces).
# SecretStore is namespace-scoped (isolated per team/namespace).
#
# All kinds here are external-secrets.io/v1 (v1beta1 is no longer served by ESO 2.x).
# These stores point at services that do not exist in a bare cluster (Vault, AWS, GCP), so they are
# validated statically in CI; l4 shows a store that runs anywhere.
#
# Apply:
#   kubectl apply -f l2-secretstore-vault.yaml
#
# Verify:
#   kubectl get clustersecretstore vault-backend -o yaml
#   kubectl get secretstore vault-backend -n myapp -o yaml
#
# OpenBao (the MPL-2.0 fork of Vault, see the Vault notes in the repo README) is wire-compatible: ESO ships
# an `openbao` provider and the `vault` provider below also works against it.
# =============================================================================

---
# ClusterSecretStore: shared Vault backend for all namespaces
# Uses Kubernetes auth (recommended — no static tokens)
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend-cluster-wide
  annotations:
    description: "Vault ClusterSecretStore using Kubernetes auth — accessible from all namespaces"
spec:
  provider:
    vault:
      # Vault server URL — use internal K8s service if Vault is in-cluster
      server: "https://vault.vault.svc.cluster.local:8200"
      # KV v2 mount path (matches vault secrets enable -path=secret kv-v2)
      path: "secret"
      version: "v2"    # KV v2 (versioned secrets)

      # TLS: verify Vault's certificate against this CA
      caProvider:
        type: ConfigMap
        name: vault-ca-cert
        namespace: vault
        key: ca.crt

      # Authentication method: Kubernetes (recommended for in-cluster usage)
      # Vault must have auth/kubernetes configured:
      #   vault auth enable kubernetes
      #   vault write auth/kubernetes/config kubernetes_host="https://$K8S_HOST:443"
      auth:
        kubernetes:
          # Vault auth mount path
          mountPath: "kubernetes"
          # Vault role bound to the ESO service account
          role: "external-secrets-role"
          # K8s ServiceAccount ESO uses to authenticate to Vault
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets

---
# Namespace-scoped SecretStore for team 'myapp' — uses AppRole auth
# AppRole is preferred when namespace isolation is required
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: myapp
  annotations:
    description: "Vault SecretStore for myapp namespace using AppRole auth"
spec:
  provider:
    vault:
      server: "https://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"

      # A namespaced SecretStore can only reference a ConfigMap in its own namespace
      # (caProvider.namespace is only allowed on a ClusterSecretStore).
      caProvider:
        type: ConfigMap
        name: vault-ca-cert
        key: ca.crt

      # AppRole authentication: RoleID is an identifier (inline is fine), SecretID is sensitive
      auth:
        appRole:
          # Vault auth mount path for AppRole
          path: "approle"
          roleId: "myapp-role-id-placeholder"
          # SecretID stored in a K8s Secret (sensitive — created out-of-band)
          # kubectl create secret generic vault-approle-secret \
          #   --from-literal=secretId=<vault-secret-id> -n myapp
          secretRef:
            name: vault-approle-secret
            key: secretId

---
# ClusterSecretStore for AWS Secrets Manager (alternative provider example)
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager-backend
  annotations:
    description: "AWS Secrets Manager ClusterSecretStore using IRSA (no static credentials)"
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      # IRSA auth: ESO ServiceAccount has IAM role annotation (no access keys)
      # ESO ServiceAccount must have annotation:
      #   eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT:role/external-secrets-role
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets

---
# ClusterSecretStore for GCP Secret Manager
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: gcp-secretmanager-backend
  annotations:
    description: "GCP Secret Manager ClusterSecretStore using Workload Identity"
spec:
  provider:
    gcpsm:
      projectID: "my-gcp-project"
      # Workload Identity: no SA key file needed
      # ESO ServiceAccount must have annotation:
      #   iam.gke.io/gcp-service-account: external-secrets@PROJECT.iam.gserviceaccount.com
      auth:
        workloadIdentity:
          clusterLocation: us-central1
          clusterName: my-cluster
          clusterProjectID: my-gcp-project
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
