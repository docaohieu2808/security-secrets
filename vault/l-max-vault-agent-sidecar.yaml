# =============================================================================
# l-max - Vault Agent Injector on Kubernetes: secrets arrive as files, the app never sees a Vault token
#
# A mutating webhook adds a Vault Agent init container and sidecar to Pods that carry vault.hashicorp.com/*
# annotations. The agent logs in with the Pod's ServiceAccount (Kubernetes auth), fetches the secrets, renders them
# with templates into an in-memory volume at /vault/secrets, and keeps renewing leases.
#
# Newer alternative: the Vault Secrets Operator (VSO) syncs Vault secrets into Kubernetes Secrets with CRDs and
# needs no sidecar. The injector is still maintained (vault-k8s) and is the one asked about in interviews.
#
# Install the injector (dev server for a lab only; production uses Raft HA with TLS):
#   helm repo add hashicorp https://helm.releases.hashicorp.com
#   helm install vault hashicorp/vault --namespace vault --create-namespace \
#     --set injector.enabled=true --set server.dev.enabled=true
# Once, inside the Vault server:
#   vault auth enable kubernetes
#   vault write auth/kubernetes/config kubernetes_host="https://$KUBERNETES_PORT_443_TCP_ADDR:443"
#   vault policy write myapp-policy - <<'POLICY'
#   path "kv-apps/data/myapp/*"          { capabilities = ["read"] }
#   path "database/creds/myapp-readonly" { capabilities = ["read"] }
#   path "pki-int/issue/web-server"      { capabilities = ["create", "update"] }
#   POLICY
#   vault write auth/kubernetes/role/myapp-role bound_service_account_names=myapp-service-account \
#     bound_service_account_namespaces=myapp policies=myapp-policy ttl=1h
# Then:  kubectl apply -f l-max-vault-agent-sidecar.yaml
#
# CI validates these manifests (kubeconform) but cannot run them: that needs a Vault server wired to a cluster.
# =============================================================================
# The Namespace comes first so a single `kubectl apply -f` does not fail with 'namespace "myapp" not found'.
apiVersion: v1
kind: Namespace
metadata:
  name: myapp
  labels:
    team: platform
    environment: production
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: myapp-service-account
  namespace: myapp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-with-vault-sidecar
  namespace: myapp
  labels:
    app.kubernetes.io/name: myapp
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: backend
    app.kubernetes.io/managed-by: kubectl
    team: platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: myapp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: myapp
        app.kubernetes.io/component: backend
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "myapp-role"                 # the Kubernetes auth role created above

        # Dynamic database credentials -> /vault/secrets/database-credentials (shell-sourceable)
        vault.hashicorp.com/agent-inject-secret-database-credentials: "database/creds/myapp-readonly"
        vault.hashicorp.com/agent-inject-template-database-credentials: |
          {{- with secret "database/creds/myapp-readonly" -}}
          export DB_USERNAME="{{ .Data.username }}"
          export DB_PASSWORD="{{ .Data.password }}"
          {{- end }}

        # KV v2 secret -> /vault/secrets/app-config (KV v2 paths contain /data/)
        vault.hashicorp.com/agent-inject-secret-app-config: "kv-apps/data/myapp/api-keys"
        vault.hashicorp.com/agent-inject-template-app-config: |
          {{- with secret "kv-apps/data/myapp/api-keys" -}}
          {
            "payment_key": "{{ .Data.data.payment_key }}",
            "mail_key": "{{ .Data.data.mail_key }}"
          }
          {{- end }}

        # TLS: ONE template issues ONE certificate and writes it and its key together. Two templates that each
        # call the PKI issue endpoint would produce two different certificates, so the key would not match the
        # certificate. pkiCert caches the issued pair and renews it before it expires.
        vault.hashicorp.com/agent-inject-secret-tls.crt: "pki-int/issue/web-server"
        vault.hashicorp.com/agent-inject-template-tls.crt: |
          {{- with pkiCert "pki-int/issue/web-server" "common_name=myapp.internal.example.com" "ttl=24h" -}}
          {{ .Cert }}{{ .CA }}
          {{ .Key | writeToFile "/vault/secrets/tls.key" "" "" "0600" }}
          {{- end }}

        # Agent behaviour
        vault.hashicorp.com/agent-pre-populate-only: "false"    # keep the sidecar running to renew leases and rotate files
        vault.hashicorp.com/agent-revoke-on-shutdown: "true"
        vault.hashicorp.com/agent-revoke-grace: "5s"
        vault.hashicorp.com/agent-limits-cpu: "250m"
        vault.hashicorp.com/agent-limits-mem: "128Mi"
        vault.hashicorp.com/agent-requests-cpu: "50m"
        vault.hashicorp.com/agent-requests-mem: "64Mi"
        vault.hashicorp.com/log-level: "info"

        # TLS to Vault: ca-cert is a path INSIDE the agent container; tls-secret is the Kubernetes Secret
        # (key ca.crt) that the injector mounts at /vault/tls. Without tls-secret that file does not exist.
        vault.hashicorp.com/service: "https://vault.vault.svc.cluster.local:8200"
        vault.hashicorp.com/tls-secret: "vault-ca"
        vault.hashicorp.com/ca-cert: "/vault/tls/ca.crt"
    spec:
      serviceAccountName: myapp-service-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: myapp
          image: myapp:1.0.0                    # placeholder image
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          command:
            - /bin/sh
            - -c
            - |
              . /vault/secrets/database-credentials
              exec /app/server --tls-cert /vault/secrets/tls.crt --tls-key /vault/secrets/tls.key
          env:
            - name: APP_ENV
              value: production
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /ready, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir: {}
