# =============================================================================
# l1 - Vault dev server via Docker Compose
#
# Dev mode = one node, in-memory storage, auto-unsealed, root token chosen by you, HTTP not HTTPS.
# EVERYTHING IS LOST ON RESTART and the root token is a known string: for learning only.
#
#   docker compose -f l1-dev-server-docker-compose.yml up -d --wait
#   export VAULT_ADDR=http://127.0.0.1:8200 VAULT_TOKEN=dev-root-token
#   vault status
#
# The port is published on 127.0.0.1 only. The dev listener inside the container is 0.0.0.0 (it has to be,
# for the published port to work), so the loopback binding on the host is what keeps a known root token away
# from the network. Do NOT change it to "8200:8200" on a shared machine.
#
# Version / licence: hashicorp/vault 2.2.1 (current, Oct 2026). Every 1.x line is end of life now (1.21 ended
# in April 2026; 1.17, the tag this file used before, ended in October 2024).
# Vault has been under the Business Source License 1.1 since 1.15 (HashiCorp, now IBM): free to use, not
# open source. OpenBao (Linux Foundation, MPL-2.0) is the open-source fork of Vault 1.14; swap the image for
# `openbao/openbao:2.7.1` and the `vault` CLI for `bao` to try it. Everything in this directory is plain Vault
# HTTP API, which OpenBao serves.
#
# Production is a different animal: integrated storage (Raft), TLS, auto-unseal, audit devices. See the README.
# =============================================================================
name: vault-dev

services:
  vault:
    image: hashicorp/vault:2.2.1
    restart: unless-stopped
    command: ["server", "-dev"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-dev-root-token}
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - "127.0.0.1:8200:8200"      # API and UI, loopback only
    cap_add:
      - IPC_LOCK                    # keeps secrets out of swap; Vault refuses to start without it unless disable_mlock is set
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # PostgreSQL for l3 (dynamic database credentials). Not started by default:
  #   docker compose -f l1-dev-server-docker-compose.yml --profile db up -d --wait
  # Vault (in its own container) reaches it as host `postgres`; the published port is for your psql only.
  postgres:
    image: postgres:17-alpine
    profiles: [db]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}      # dev default; l3 can rotate it away from you
      POSTGRES_DB: myapp
    ports:
      - "127.0.0.1:${POSTGRES_PUBLISH_PORT:-15432}:5432"
    volumes:
      - ./l3-seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d myapp"]
      interval: 5s
      timeout: 5s
      retries: 10
