# =============================================================================
# l-max-falco-plugin-config.yaml — Falco L-Max: Plugin framework configuration
#
# Falco plugins extend detection beyond syscalls to cloud APIs, K8s audit logs,
# GitHub events, Okta logs, AWS CloudTrail, and more.
#
# Apply:
#   kubectl create configmap falco-plugin-config \
#     --from-file=falco.yaml=l-max-falco-plugin-config.yaml \
#     --namespace falco --dry-run=client -o yaml | kubectl apply -f -
#
# Plugin registry: https://artifacthub.io/packages/search?kind=13
# Install plugins: falcoctl artifact install <plugin-name>
# =============================================================================

# --- Plugin loading ----------------------------------------------------------
# Plugins are shared libraries (.so) loaded at Falco startup.
# Each plugin has an init_config (static) and open_params (per-source).

plugins:
  # ---------------------------------------------------------------------------
  # Plugin: k8saudit — Kubernetes Audit Log analysis
  # Captures K8s API server audit events: RBAC changes, secret access, exec, etc.
  # Requires K8s API server audit webhook pointing to Falco's port 9765
  # ---------------------------------------------------------------------------
  - name: k8saudit
    library_path: libk8saudit.so
    init_config:
      sslCertificate: /etc/falco/certs/server.crt
    open_params: "http://0.0.0.0:9765/k8s-audit"

  # ---------------------------------------------------------------------------
  # Plugin: cloudtrail — AWS CloudTrail event analysis
  # Detects: IAM abuse, S3 data exfil, EC2 security group changes, root login
  # Reads from SQS queue that CloudTrail S3 notifications are sent to
  # ---------------------------------------------------------------------------
  - name: cloudtrail
    library_path: libcloudtrail.so
    init_config:
      aws_region: "us-east-1"
      # Use IAM role (IRSA on EKS) — avoid static credentials
      # aws_access_key_id: ""     # Prefer IRSA / instance profile
      # aws_secret_access_key: ""
    open_params: "sqs://falco-cloudtrail-events"

  # ---------------------------------------------------------------------------
  # Plugin: github — GitHub webhook event analysis
  # Detects: secret exposure in commits, branch protection changes, force pushes
  # Requires GitHub webhook sending events to Falco's HTTP endpoint
  # ---------------------------------------------------------------------------
  - name: github
    library_path: libgithub.so
    init_config:
      secret: ""    # GitHub webhook secret — inject via K8s Secret
    open_params: "http://0.0.0.0:9766/github"

  # ---------------------------------------------------------------------------
  # Plugin: okta — Okta Identity event analysis
  # Detects: brute force, MFA bypass, suspicious logins, admin privilege abuse
  # ---------------------------------------------------------------------------
  - name: okta
    library_path: libokta.so
    init_config:
      organization: "your-org.okta.com"
      api_token: ""    # Inject via K8s Secret / Vault agent
    open_params: ""

  # ---------------------------------------------------------------------------
  # Plugin: json — Generic JSON event parsing
  # Enables Falco to process arbitrary JSON event streams
  # ---------------------------------------------------------------------------
  - name: json
    library_path: libjson.so
    init_config: ""
    open_params: ""

# --- Event sources -----------------------------------------------------------
# Tell Falco which plugins to use as event sources (in addition to syscalls)
load_plugins:
  - k8saudit
  - cloudtrail
  - github
  - okta
  - json

# --- K8s Audit specific rules ------------------------------------------------
# These rules are loaded when k8saudit plugin is active
# Place in /etc/falco/rules.d/k8saudit-custom.yaml

# Example rules (inline for reference — move to rules.d in production):
#
# - rule: K8s Secret Accessed by Non-Controller
#   desc: A secret was read by a non-system service account
#   condition: >
#     k8s_audit
#     and ka.verb=get
#     and ka.target.resource=secrets
#     and not ka.user.name startswith "system:"
#   output: >
#     Secret accessed (user=%ka.user.name secret=%ka.target.name ns=%ka.target.namespace)
#   priority: WARNING
#   source: k8s_audit
#   tags: [k8s, secret, mitre_credential_access]
#
# - rule: K8s RBAC ClusterRoleBinding Created
#   desc: A new ClusterRoleBinding was created — may grant excessive permissions
#   condition: >
#     k8s_audit
#     and ka.verb in (create, update)
#     and ka.target.resource=clusterrolebindings
#   output: >
#     ClusterRoleBinding created/updated (user=%ka.user.name binding=%ka.target.name)
#   priority: WARNING
#   source: k8s_audit
#   tags: [k8s, rbac, mitre_privilege_escalation]

# --- Falco engine settings for plugin mode -----------------------------------
falco:
  # When using plugins as primary source, syscall capture can be disabled
  # to reduce overhead. Set false only if you have syscall coverage elsewhere.
  syscall_event_source:
    enabled: true

  # HTTP server for receiving plugin webhook events
  webserver:
    enabled: true
    listen_port: 9765
    k8s_audit_endpoint: /k8s-audit
    k8s_healthz_endpoint: /healthz
    ssl_enabled: false   # Enable with valid cert in production

  # Output throttling — prevent alert floods from noisy sources
  outputs:
    rate: 100          # Max alerts per second before throttling
    max_burst: 1000    # Burst allowance before throttle kicks in
