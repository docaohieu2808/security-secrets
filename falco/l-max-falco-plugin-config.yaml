# =============================================================================
# l-max - Falco plugins: Kubernetes audit events as a second event source (Helm values)
#
# Falco is not only syscalls. A plugin turns another stream into events that rules can match: the
# Kubernetes API-server audit log (k8saudit), AWS CloudTrail, GitHub webhooks, Okta... This file runs
# Falco as a *Deployment* that only consumes k8s audit events (no kernel driver, no syscalls), next to
# the DaemonSet from l1. It is the same shape as the chart's own values-k8saudit.yaml.
#
#   helm upgrade --install falco-audit falcosecurity/falco --version 9.2.1 \
#     --namespace falco --create-namespace -f l-max-falco-plugin-config.yaml
#
# Then point the API server at the webhook (kube-apiserver --audit-webhook-config-file, audit policy
# file); the NodePort below is reachable from the control plane. The plugin and the default k8s audit
# rules are fetched at startup by falcoctl (init container) and kept current by the follow sidecar.
#
# The old version of this file mixed Helm values with raw falco.yaml (a `falco:` wrapper plus
# `syscall_event_source` and nested `webserver`), which is neither: use `falco.plugins` /
# `falco.load_plugins`, `driver.enabled: false` and `falcoctl` as below.
# =============================================================================

# No syscalls from this release, so no driver and no container/k8s metadata collectors.
driver:
  enabled: false
collectors:
  enabled: false

# One instance is enough for a webhook source; more replicas would each see a share of the events.
controller:
  kind: deployment
  deployment:
    replicas: 1

falcoctl:
  artifact:
    install:
      enabled: true     # init container: download the plugin + rules before Falco starts
    follow:
      enabled: true     # sidecar: pull rule updates
  config:
    artifact:
      install:
        refs: [k8saudit-rules:0.16, k8saudit:0.16, json:0.7]
      follow:
        refs: [k8saudit-rules:0.16]

# The audit webhook target (kube-apiserver -> http://<node>:30007/k8s-audit)
services:
  - name: k8saudit-webhook
    type: NodePort
    ports:
      - port: 9765          # matches open_params below
        nodePort: 30007
        protocol: TCP

falco:
  rules_files:
    - /etc/falco/k8s_audit_rules.yaml     # installed by falcoctl
    - /etc/falco/rules.d                  # customRules below
  plugins:
    - name: k8saudit
      library_path: libk8saudit.so
      init_config: ""
      open_params: "http://:9765/k8s-audit"
    - name: json
      library_path: libjson.so
      init_config: ""
    # More sources follow the same pattern; add the artifact to falcoctl refs and the entry here:
    #   - name: cloudtrail
    #     library_path: libcloudtrail.so
    #     init_config: ""
    #     open_params: "s3://my-cloudtrail-bucket/AWSLogs/"   # credentials from IRSA / instance profile, never inline
    #   - name: github
    #     library_path: libgithub.so
    #     init_config: ""
    #     open_params: "http://:9000/github"                  # webhook secret via Secret, not in values
  load_plugins: [k8saudit, json]
  json_output: true

# Rules of our own on top of the stock k8s audit rules.
customRules:
  k8saudit-custom.yaml: |-
    - required_engine_version: 0.57.0

    - rule: Lab Secret Read by Non-System User
      desc: A Secret was read through the API by an identity that is not a system component.
      condition: >
        ka.verb in (get, list) and ka.target.resource=secrets
        and not ka.user.name startswith "system:"
      output: >
        Secret read (user=%ka.user.name verb=%ka.verb secret=%ka.target.name ns=%ka.target.namespace)
      priority: WARNING
      source: k8s_audit
      tags: [k8s, secret, mitre_credential_access]

    - rule: Lab ClusterRoleBinding Changed
      desc: A ClusterRoleBinding was created or updated, which can grant wide permissions.
      condition: >
        ka.verb in (create, update, patch) and ka.target.resource=clusterrolebindings
      output: >
        ClusterRoleBinding changed (user=%ka.user.name verb=%ka.verb binding=%ka.target.name)
      priority: WARNING
      source: k8s_audit
      tags: [k8s, rbac, mitre_privilege_escalation]
