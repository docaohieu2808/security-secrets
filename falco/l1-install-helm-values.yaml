# =============================================================================
# l1 - Falco: Helm install values (chart falco-9.2.1, Falco 0.45.1)
#
#   helm repo add falcosecurity https://falcosecurity.github.io/charts && helm repo update
#   helm install falco falcosecurity/falco --version 9.2.1 \
#     --namespace falco --create-namespace \
#     -f l1-install-helm-values.yaml \
#     --set-file customRules.custom-rules\\.yaml=l2-custom-rules.yaml
#
# What changed in chart 9.x (Falco 0.44+), and why the old values break `helm install`:
#   - driver.kind=ebpf (legacy probe) and the gVisor engine are gone. Use modern_ebpf (CO-RE, kernel >= 5.8,
#     nothing to download or compile) or kmod. `auto` picks one for you.
#   - the gRPC output/server (falco.grpc, falco.grpc_output) is gone. Use http_output (Falcosidekick does
#     this for you), file_output or stdout_output.
#   - `rules_file` (singular) was renamed `rules_files` in Falco 0.38.
#   The chart refuses to render if a removed key is still present, so a stale values file fails fast.
#
# Runs on a real node kernel; it will not start inside kind/Docker Desktop VMs without BPF/BTF support.
# CI therefore validates the chart render and the rules (`falco --validate`), not the live driver.
# =============================================================================

# --- Driver ------------------------------------------------------------------
# kind: auto | modern_ebpf | kmod
driver:
  kind: modern_ebpf
  modernEbpf:
    # true = run with CAP_BPF/CAP_PERFMON/CAP_SYS_RESOURCE/CAP_SYS_PTRACE instead of a privileged container
    leastPrivileged: true

# --- Falco core settings (these map 1:1 to falco.yaml) -----------------------
falco:
  rules_files:
    - /etc/falco/falco_rules.yaml
    - /etc/falco/falco_rules.local.yaml
    - /etc/falco/rules.d          # customRules (below) are mounted here

  json_output: true
  json_include_output_property: true
  log_stderr: true
  log_level: info
  priority: warning               # emergency | alert | critical | error | warning | notice | informational | debug

  # Alerts go to stdout (kubectl logs) and, via Falcosidekick below, to http_output.
  stdout_output:
    enabled: true

  syscall_event_drops:
    actions: [log, alert]
    rate: 0.03333                 # at most one drop alert per 30 s
    max_burst: 1

# --- Custom rules ------------------------------------------------------------
# Inline example; the install command above feeds l2-custom-rules.yaml with --set-file instead.
# customRules:
#   custom-rules.yaml: |-
#     - rule: ...

# --- Falcosidekick: fan alerts out to Slack, Loki, Elasticsearch, PagerDuty... -
falcosidekick:
  enabled: true
  config:
    slack:
      webhookurl: ""              # --set falcosidekick.config.slack.webhookurl=<url>
      minimumpriority: warning
    loki:
      hostport: ""                # for example http://loki.monitoring:3100
      minimumpriority: warning
  webui:
    enabled: true
    replicaCount: 1

# --- Resources / placement ---------------------------------------------------
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

controller:
  kind: daemonset                 # one pod per node

tolerations:
  - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}

serviceMonitor:
  create: false                   # true if the Prometheus Operator is installed
