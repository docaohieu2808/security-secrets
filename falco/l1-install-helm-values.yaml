# =============================================================================
# l1-install-helm-values.yaml — Falco Level 1: Helm install values
#
# Install Falco via Helm with sensible production defaults.
#
# Usage:
#   helm repo add falcosecurity https://falcosecurity.github.io/charts
#   helm repo update
#   helm install falco falcosecurity/falco \
#     --namespace falco --create-namespace \
#     --values l1-install-helm-values.yaml
#
# Upgrade:
#   helm upgrade falco falcosecurity/falco \
#     --namespace falco \
#     --values l1-install-helm-values.yaml
# =============================================================================

# --- Driver configuration ----------------------------------------------------
# driver.kind: how Falco captures kernel syscalls
#   ebpf    — modern, no kernel module required, works on GKE/EKS/AKS
#   module  — traditional kernel module (requires privileged access)
#   modern_ebpf — CO-RE eBPF, no probe download needed (kernel >= 5.8)
driver:
  kind: ebpf
  ebpf:
    # Path to the eBPF probe inside the container
    path: ${HOME}/.falco/falco-bpf.o
    # Automatically build probe if not found for this kernel version
    leastPrivileged: false

# --- Falco core settings -----------------------------------------------------
falco:
  # Rules files loaded in order (later files override earlier ones)
  rules_file:
    - /etc/falco/falco_rules.yaml
    - /etc/falco/falco_rules.local.yaml
    - /etc/falco/rules.d

  # Output channels — enable all for production
  json_output: true                  # Structured JSON for log aggregation
  json_include_output_property: true # Include 'output' field in JSON
  log_stderr: true
  log_level: info                    # debug | info | notice | warning | error

  # Alert priority threshold — only alert on >= this level
  # Levels: emergency, alert, critical, error, warning, notice, informational, debug
  priority: warning

  # gRPC output for Falcosidekick integration
  grpc:
    enabled: true
    bind_address: "unix:///run/falco/falco.sock"
    threadiness: 8

  grpc_output:
    enabled: true

  # Buffered outputs reduce CPU usage at cost of slight delay
  buffered_outputs: false

  # Syscall event drops — what to do when the ring buffer is full
  syscall_event_drops:
    actions:
      - log
      - alert
    rate: 0.03333   # Max 1 drop alert per 30 seconds
    max_burst: 1

# --- Falcosidekick sidecar ---------------------------------------------------
# Falcosidekick forwards alerts to Slack, PagerDuty, Elasticsearch, etc.
falcosidekick:
  enabled: true
  # Falcosidekick configuration — set webhook/integration URLs via Secret
  config:
    slack:
      webhookurl: ""          # Set via: --set falcosidekick.config.slack.webhookurl=<url>
      minimumpriority: warning
    pagerduty:
      routingkey: ""          # Set via Secret or --set
      minimumpriority: critical
    elasticsearch:
      hostport: ""            # e.g. http://elasticsearch:9200
      index: falco
      minimumpriority: warning
    loki:
      hostport: ""            # e.g. http://loki:3100
      minimumpriority: warning
  webui:
    enabled: true             # Falcosidekick UI dashboard
    replicaCount: 1

# --- Resource limits ---------------------------------------------------------
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# --- DaemonSet settings ------------------------------------------------------
# Falco runs as a DaemonSet — one pod per node
tolerations:
  # Run on control plane nodes too for full coverage
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule

# Required for kernel-level syscall capture
securityContext:
  privileged: true             # Needed for kernel module / eBPF probe loading

# --- Metrics -----------------------------------------------------------------
serviceMonitor:
  create: false   # Set true if Prometheus Operator is installed

# --- Node selector -----------------------------------------------------------
nodeSelector: {}

# --- Extra volumes for custom rules ------------------------------------------
# Mount custom rules ConfigMap (see l2-custom-rules.yaml)
extraVolumes:
  - name: custom-rules
    configMap:
      name: falco-custom-rules

extraVolumeMounts:
  - name: custom-rules
    mountPath: /etc/falco/rules.d
    readOnly: true
